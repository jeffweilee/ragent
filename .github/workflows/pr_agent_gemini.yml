name: Gemini PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run PR Agent
    steps:
      - name: PR Agent action
        id: pragent
        uses: Codium-ai/pr-agent@main
        env:
          # pr-agent authenticates to GitHub with this to fetch the diff and post
          # its review. Without it the action logs "GITHUB_TOKEN not set" and
          # exits 0 — a green run that reviewed nothing, which is harder to
          # notice than a red one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Gemini key belongs under google_ai_studio, NOT openai. It was
          # previously set as OPENAI.KEY, so litellm authenticated against
          # OpenAI with a Google key ("Incorrect API key provided: AIzaSy…") and
          # Gemini itself was never reachable.
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.MODEL: "gemini/gemini-3.6-flash"
          # Without this, pr-agent falls back to its default OpenAI model, for
          # which no key is configured — turning any Gemini hiccup into an
          # OpenAI auth error and sending the Google key to a third party.
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-2.5-flash"]'
          # pr-agent's own default pr_actions omits `synchronize`, so it logged
          # "Skipping action: synchronize" and did nothing on every push — even
          # though the workflow's `types:` above asks for it. Listed explicitly so
          # the two agree; drop `synchronize` here to review only on PR open.
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'
