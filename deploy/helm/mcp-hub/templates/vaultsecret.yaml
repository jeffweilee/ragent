# ricoberger/vault-secrets-operator: syncs Vault KV-v2 keys into a native K8s
# Secret. The Deployment consumes it via envFrom so the Hub process sees each
# key as a plain env var — matching what render_secrets() reads at startup.
#
# Keys to add: one entry per {% .Secrets.KEY %} used across all tool YAMLs,
# plus MCP_HUB_AUTH_TOKEN for the hub's own auth guard.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: {{ include "mcp-hub.fullname" . }}-secrets
  labels:
    {{- include "mcp-hub.labels" . | nindent 4 }}
spec:
  path: {{ .Values.vault.path }}
  type: Opaque
  vaultRole: {{ .Values.vault.role }}
  reconcileStrategy: Replace
  keys:
    - MCP_HUB_AUTH_TOKEN
    # Add one entry per {% .Secrets.KEY %} referenced in files/tools.d/*.yaml:
    # - HTTPBIN_TOKEN
    # - PAYMENT_API_KEY
