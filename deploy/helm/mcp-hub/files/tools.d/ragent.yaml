# system "ragent" — exposes POST /retrieve/v1 as an MCP tool.
# Deployed as part of the cluster; base_url points to the ragent-api Service.
#
# CD workflow: edit this file → git push → ArgoCD syncs ConfigMap →
# stakater/reloader restarts the mcp-hub Pod. Zero code rebuild required.

system: ragent

defaults:
  base_url: http://ragent-api:8000
  timeout: 30.0
  max_connections: 50
  headers:
    Accept: application/json

tools:
  - name: retrieve
    description: |
      Retrieve top-k document chunks for a natural-language query from the
      RAG knowledge base. Returns excerpts ranked by combined vector + BM25
      score (optionally reranked).
    method: POST
    path: /retrieve/v1
    forward_headers:
      X-User-Id: "{x-user-id}"
      # ragent JWT guard (RAGENT_JWT_HEADER, default X-Auth-Token).
      # The MCP client must include this header so /retrieve/v1 passes auth.
      X-Auth-Token: "{x-auth-token}"
    parameters:
      - name: query
        type: string
        location: body
        required: true
        description: Natural-language search query.
      - name: source_app
        type: string
        location: body
        required: false
        description: Optional filter restricting results to a single source app.
      - name: source_meta
        type: string
        location: body
        required: false
        description: Optional filter restricting results to a single source-meta tag.
      - name: top_k
        type: integer
        location: body
        required: false
        default: 20
        description: Maximum chunks to return (1-200).
      - name: min_score
        type: number
        location: body
        required: false
        description: Drop chunks whose score is below this threshold.
      - name: dedupe
        type: boolean
        location: body
        required: false
        default: false
        description: If true, collapse multiple chunks from the same source document.
