[project]
name = "mcp-hub"
version = "0.1.0"
description = "Dynamic MCP Hub: turn REST APIs declared in YAML into MCP tools"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.3.1",
    "httpx==0.28.1",
    "prometheus-client==0.25.0",
    "pyyaml==6.0.3",
    "structlog==25.5.0",
    "uvicorn[standard]==0.47.0",
    "python-multipart==0.0.29",
]

[project.scripts]
mcp-hub = "mcp_hub.server:main"
mcp-hub-doctor = "mcp_hub.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-httpserver==1.1.5",
    "ruff==0.15.14",
]
